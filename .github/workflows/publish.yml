name: Validate and publish SafeRevoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after the trusted publisher is configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: saferevoke-release
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - name: Verify runtime availability
        run: |
          node --version
          java --version
      - name: Run SDK verification
        run: python -m unittest discover -s tests -v

  docker-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Cache the official database images
        run: |
          docker pull postgres:17-alpine
          docker pull mysql:8.4
      - name: Verify real database startup, SQL and cleanup
        env:
          SAFEREVOKE_DOCKER_LIVE: "1"
        run: python -m unittest discover -s tests -p test_docker_database.py -v

  upstream-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: pallets/flask
          ref: 2c1b30d0503cfb064f1cb252e6614a06915a362a
          path: reports/upstream-flask-3.1.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m examples.upstream_flaskr.run reports/upstream-flask-3.1.2

  build:
    needs: [verify, docker-live, upstream-application]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Check package metadata and description
        run: python -m twine check --strict dist/*
      - name: Verify a clean wheel installation
        shell: bash
        run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/saferevoke/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-distributions
          path: dist/
      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
