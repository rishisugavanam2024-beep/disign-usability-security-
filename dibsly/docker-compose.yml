services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dibsly
      MYSQL_USER: dibsly
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 1g
    logging:
      options: {max-size: "10m", max-file: "3"}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      PORT: 8090
      DB_URL: jdbc:mysql://db:3306/dibsly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=15000
      DB_USER: dibsly
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECURE_COOKIES: "true"
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-rishisugavanam200@gmail.com}
    expose: ["8090"]
    volumes:
      - app_data:/app/data
    mem_limit: 768m
    logging:
      options: {max-size: "10m", max-file: "3"}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your domain in SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  mysql_data:
  app_data:
  caddy_data:
  caddy_config:
